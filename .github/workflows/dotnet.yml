# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_EXE_PATH: dotnet
  DOTNET_NOLOGO: true

jobs:
  build-linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-tags: true
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: Build
      run: ./build.sh
      shell: bash
  build-mac:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-tags: true
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: Build
      run: ./build.sh
      shell: bash
  build-win:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-tags: true
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
    - name: Build
      run: ./build.ps1
      shell: pwsh
